<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} · ProductivityAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body style="background:linear-gradient(135deg,#14142B 0%,#2C1F5A 55%,#6C5CE7 100%);min-height:100vh;">
  <div class="d-flex flex-column align-items-center justify-content-center text-center text-white" style="min-height:100vh;">
    <div class="logo-icon mb-4" style="width:70px;height:70px;font-size:30px;"><i class="fa-solid {{ icon }}"></i></div>
    <h1 style="font-size:64px;font-weight:700;">{{ code }}</h1>
    <p style="font-size:16px;color:#C4C4E0;max-width:420px;">{{ message }}</p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-gradient mt-3 px-4">
      <i class="fa-solid fa-house me-1"></i>Back to {{ 'Dashboard' if current_user.is_authenticated else 'Login' }}
    </a>
  </div>
</body>
</html>
