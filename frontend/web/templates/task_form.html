{% extends "base.html" %}
{% block title %}Assign Task{% endblock %}
{% block page_title %}Assign Task{% endblock %}
{% block page_subtitle %}Create and assign a new task to a team member{% endblock %}

{% block content %}
<div class="card-glass" style="max-width:700px;">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Employee</label>
        <select class="form-select" name="employee_id" required>
          <option value="">Select Employee</option>
          {% for e in employees %}
          <option value="{{ e.id }}">{{ e.name }} ({{ e.employee_code }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Category</label>
        <input type="text" class="form-control" name="category" placeholder="e.g. Development, Support">
      </div>
      <div class="col-12">
        <label class="form-label">Task Title</label>
        <input type="text" class="form-control" name="title" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Priority</label>
        <select class="form-select" name="priority">
          {% for p in ['Low','Medium','High','Critical'] %}
          <option value="{{ p }}" {{ 'selected' if p=='Medium' }}>{{ p }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Estimated Hours</label>
        <input type="number" step="0.1" class="form-control" name="estimated_hours" value="8">
      </div>
      <div class="col-md-4">
        <label class="form-label">Deadline</label>
        <input type="date" class="form-control" name="deadline" required>
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-gradient px-4"><i class="fa-solid fa-check me-1"></i>Assign Task</button>
      <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-outline-soft px-4">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
